    <script>
        (function() {
            async function askPassword() {
                
                var pwd = prompt("此页面已受保护，请输入访问密码：\n(BY TG@WaterChisato)");

                    document.body.innerHTML = "<h1>访问被拒绝</h1><p>未输入密码，无法访问。</p>";
                    return;
                }
                var inputHash = await sha256(pwd);
                if (inputHash !== window.__PAGE_HASH__) {
                    alert("密码错误！请重新输入。");
                    askPassword();
                    return;
                }
                try {
                    var decodedHtml = decrypt(pwd, window.__PAGE_PAYLOAD__);
                    document.documentElement.innerHTML = decodedHtml;
                    var scripts = document.documentElement.getElementsByTagName('script');
                    for (var i = 0; i < scripts.length; i++) { eval(scripts[i].text); }
                } catch(e) {
                    alert("解密失败。");
                }
            }
            window.onload = askPassword;
        })();
